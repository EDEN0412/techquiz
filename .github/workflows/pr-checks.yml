name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

jobs:
  quick_tests:
    name: Quick Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: techskillsquiz.settings.test
      DATABASE_NAME: test_db
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
          POSTGRES_USER: ${{ env.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install --with dev
          pip install pytest pytest-cov pytest-django psutil
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ env.DATABASE_USER }}; do
            echo "Waiting for PostgreSQL to start..."
            sleep 1
          done
          echo "PostgreSQL started."
          
      - name: Apply migrations
        run: |
          cd backend
          python manage.py migrate --noinput
      
      - name: Run critical tests
        run: |
          cd backend
          # 最も重要なテストのみを実行（高速化のため）
          echo "Running critical backend tests..."
          
          # モデルテスト（最重要）
          python -m pytest quiz/tests/test_models.py -v --tb=short -x
          
          # シリアライザーテスト（API検証）
          python -m pytest quiz/tests/test_serializers.py -v --tb=short -x
          
          # 認証テスト（セキュリティ重要）
          python -m pytest users/tests.py -v --tb=short -x
          
          # 新しいAPI統合テストの一部（重要なユーザージャーニーのみ）
          python -m pytest quiz/tests/test_api_integration.py::UserJourneyIntegrationTest::test_complete_user_journey -v --tb=short
      
      - name: Check code style
        run: |
          cd backend
          # flake8でコードスタイルをチェック（設定があれば）
          if [ -f "setup.cfg" ] || [ -f ".flake8" ] || [ -f "pyproject.toml" ]; then
            pip install flake8
            flake8 . || echo "Code style issues found, but not blocking PR"
          else
            echo "No flake8 configuration found, skipping style check"
          fi

  frontend_quick_checks:
    name: Frontend Quick Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Check TypeScript compilation
        run: npm run type-check || npx tsc --noEmit || echo "TypeScript check completed"
      
      - name: Run linting
        run: npm run lint || echo "Linting completed"
      
      - name: Test build
        run: npm run build
      
      - name: Run critical frontend tests
        run: |
          # 重要なフロントエンドテストのみを実行
          if [ -f "src/components/tests/QuizApiIntegration.test.ts" ]; then
            npm test -- src/components/tests/QuizApiIntegration.test.ts --run
          else
            echo "No critical frontend tests found"
          fi
      
      - name: Start backend for E2E tests
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-dev
          
          # Create minimal .env for testing
          echo "DEBUG=False" > .env.test
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env.test
          echo "DATABASE_URL=sqlite:///test.db" >> .env.test
          
          # Run migrations and start server in background
          python manage.py migrate --settings=techskillsquiz.settings.test
          python manage.py runserver 8000 --settings=techskillsquiz.settings.test &
          
          # Wait for server to start
          sleep 10
          echo "Backend server started for E2E tests"
        env:
          DJANGO_SETTINGS_MODULE: techskillsquiz.settings.test
      
      - name: Start frontend for E2E tests
        run: |
          npm run build
          npm run preview -- --port 5173 &
          sleep 5
          echo "Frontend server started for E2E tests"
      
      - name: Run critical E2E tests
        run: |
          # Run only the most critical E2E test (signup flow)
          npx playwright test e2e/user-signup-to-quiz-completion.spec.ts --project=chromium --grep "ナビゲーション：基本的な画面遷移"
        env:
          VITE_PORT: 5173
      
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security_quick_scan:
    name: Security Quick Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run quick security scan
        run: |
          cd backend
          # 高リスクのセキュリティ問題のみをチェック
          bandit -r . -ll -f txt || echo "Security scan completed with findings"
          
          # 既知の脆弱性をチェック
          safety check || echo "Dependency vulnerability scan completed"

  pr_summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quick_tests, frontend_quick_checks, security_quick_scan]
    if: always()
    
    steps:
      - name: Generate PR check summary
        run: |
          echo "# PR Check Summary" > pr-summary.md
          echo "" >> pr-summary.md
          echo "## Test Results" >> pr-summary.md
          echo "" >> pr-summary.md
          
          # ジョブの結果をチェック
          if [ "${{ needs.quick_tests.result }}" == "success" ]; then
            echo "✅ Backend Critical Tests: PASSED" >> pr-summary.md
          else
            echo "❌ Backend Critical Tests: FAILED" >> pr-summary.md
          fi
          
          if [ "${{ needs.frontend_quick_checks.result }}" == "success" ]; then
            echo "✅ Frontend Quick Checks: PASSED" >> pr-summary.md
          else
            echo "❌ Frontend Quick Checks: FAILED" >> pr-summary.md
          fi
          
          if [ "${{ needs.security_quick_scan.result }}" == "success" ]; then
            echo "✅ Security Quick Scan: PASSED" >> pr-summary.md
          else
            echo "⚠️ Security Quick Scan: COMPLETED WITH FINDINGS" >> pr-summary.md
          fi
          
          echo "" >> pr-summary.md
          echo "## Next Steps" >> pr-summary.md
          
          if [ "${{ needs.quick_tests.result }}" == "success" ] && [ "${{ needs.frontend_quick_checks.result }}" == "success" ]; then
            echo "- ✅ PR is ready for review" >> pr-summary.md
            echo "- 📋 Full test suite will run after merge to main/develop" >> pr-summary.md
          else
            echo "- ❌ Please fix failing tests before requesting review" >> pr-summary.md
            echo "- 🔍 Check the job logs for detailed error information" >> pr-summary.md
          fi
          
          cat pr-summary.md
      
      - name: Comment PR summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('pr-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
      
      - name: Set PR status
        run: |
          if [ "${{ needs.quick_tests.result }}" == "success" ] && [ "${{ needs.frontend_quick_checks.result }}" == "success" ]; then
            echo "✅ All critical checks passed. PR is ready for review."
          else
            echo "❌ Some critical checks failed. Please review and fix."
            exit 1
          fi 