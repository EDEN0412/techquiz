name: Comprehensive Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  backend_unit_tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: techskillsquiz.settings.test
      DATABASE_NAME: test_db
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
          POSTGRES_USER: ${{ env.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install --with dev
          pip install pytest pytest-cov pytest-django psutil pytest-xdist
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ env.DATABASE_USER }}; do
            echo "Waiting for PostgreSQL to start..."
            sleep 1
          done
          echo "PostgreSQL started."
          
      - name: Apply migrations
        run: |
          cd backend
          python manage.py migrate --noinput
      
      - name: Run unit tests
        run: |
          cd backend
          # モデルテスト
          python -m pytest quiz/tests/test_models.py -v --tb=short
          
          # シリアライザーテスト
          python -m pytest quiz/tests/test_serializers.py -v --tb=short
          
          # ビューテスト
          python -m pytest quiz/tests/test_views.py -v --tb=short
          
          # ユーティリティテスト
          python -m pytest quiz/tests/test_utils.py -v --tb=short
          
          # コマンドテスト
          python -m pytest quiz/tests/test_commands.py -v --tb=short
      
      - name: Generate unit test coverage report
        run: |
          cd backend
          pytest quiz/tests/test_models.py quiz/tests/test_serializers.py quiz/tests/test_views.py quiz/tests/test_utils.py quiz/tests/test_commands.py --cov=quiz --cov-report=xml --cov-report=html
      
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/

  backend_api_integration_tests:
    name: Backend API Integration Tests
    runs-on: ubuntu-latest
    needs: backend_unit_tests
    env:
      DJANGO_SETTINGS_MODULE: techskillsquiz.settings.test
      DATABASE_NAME: test_db
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
          POSTGRES_USER: ${{ env.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install --with dev
          pip install pytest pytest-cov pytest-django psutil
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ env.DATABASE_USER }}; do
            echo "Waiting for PostgreSQL to start..."
            sleep 1
          done
          echo "PostgreSQL started."
          
      - name: Apply migrations
        run: |
          cd backend
          python manage.py migrate --noinput
      
      - name: Run API integration tests
        run: |
          cd backend
          # 新しく追加したAPI統合テスト
          python -m pytest quiz/tests/test_api_integration.py -v --tb=short
          
          # 既存の統合テスト
          python -m pytest quiz/tests/test_integration.py -v --tb=short
          python -m pytest quiz/tests/test_api_client_mock.py -v --tb=short
          
          # ユーザー認証テスト
          python -m pytest users/tests.py -v --tb=short
      
      - name: Generate API integration test coverage
        run: |
          cd backend
          pytest quiz/tests/test_api_integration.py quiz/tests/test_integration.py quiz/tests/test_api_client_mock.py users/tests.py --cov=quiz --cov=users --cov-report=xml --cov-report=html
      
      - name: Upload API integration test coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-test-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/

  frontend_tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          npm install -D @vitest/coverage-v8
      
      - name: Run frontend tests
        run: |
          # テスト実行前にモックファイルディレクトリを作成
          mkdir -p src/test/mocks
          mkdir -p src/test/__mocks__
          
          # API clientをモックするファイルを作成
          echo "import { vi } from 'vitest';

          const api = {
            get: vi.fn(() => Promise.resolve({ data: {} })),
            post: vi.fn(() => Promise.resolve({ data: {} })),
            put: vi.fn(() => Promise.resolve({ data: {} })),
            delete: vi.fn(() => Promise.resolve({ data: {} })),
            patch: vi.fn(() => Promise.resolve({ data: {} }))
          };
          
          export default api;" > src/test/__mocks__/api.js
          
          # フロントエンド統合テスト実行
          npm test -- src/components/tests/QuizApiIntegration.test.ts --run
      
      - name: Generate frontend coverage
        run: |
          npm test -- src/components/tests/QuizApiIntegration.test.ts --coverage --coverage.reporter=lcov --run
      
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-coverage
          path: coverage/

  e2e_tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend_unit_tests, frontend_tests]
    env:
      DJANGO_SETTINGS_MODULE: techskillsquiz.settings.test
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: this_password_is_insecure_and_should_be_updated
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install frontend dependencies
        run: npm install
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Start Supabase local instance
        run: |
          npx supabase@latest start --exclude gotrue,realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,analytics
          echo "Supabase local instance started"
      
      - name: Wait for Supabase Database to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Supabase PostgreSQL to start..."
            sleep 2
          done
          echo "Supabase PostgreSQL started."
      
      - name: Setup backend for E2E tests
        run: |
          cd backend
          
          # Create test environment file
          echo "DEBUG=True" > .env.test
          echo "SECRET_KEY=test-secret-key-for-e2e-ci-$(date +%s)" >> .env.test
          echo "DATABASE_HOST=${{ env.DATABASE_HOST }}" >> .env.test
          echo "DATABASE_PORT=${{ env.DATABASE_PORT }}" >> .env.test
          echo "DATABASE_NAME=${{ env.DATABASE_NAME }}" >> .env.test
          echo "DATABASE_USER=${{ env.DATABASE_USER }}" >> .env.test
          echo "DATABASE_PASSWORD=${{ env.DATABASE_PASSWORD }}" >> .env.test
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env.test
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> .env.test
          echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" >> .env.test
          
          # Run migrations
          python manage.py migrate --noinput
          
          # Start Django server in background
          python manage.py runserver 8000 &
          
          # Wait for server to start and verify it's responding
          sleep 15
          curl -f http://localhost:8000/api/quiz/categories/ || echo "Backend API not ready, continuing..."
          echo "Backend server started for E2E tests"
        env:
          DJANGO_SETTINGS_MODULE: techskillsquiz.settings.test
      
      - name: Build and start frontend for E2E tests
        run: |
          # Build the frontend
          npm run build
          
          # Start the preview server in background
          npm run preview -- --host 0.0.0.0 --port 5173 &
          
          # Wait for frontend to start
          sleep 10
          curl -f http://localhost:5173/ || echo "Frontend not ready, continuing..."
          echo "Frontend server started for E2E tests"
      
      - name: Run complete E2E test suite
        run: |
          echo "Running complete E2E test suite..."
          
          # Set environment for E2E tests
          export VITE_PORT=5173
          export PLAYWRIGHT_BASE_URL=http://localhost:5173
          
          # Run all E2E tests
          npx playwright test --reporter=html,github-actions
        env:
          VITE_PORT: 5173
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      
      - name: Upload E2E test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
      
      - name: Upload E2E test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-screenshots
          path: test-results/
          retention-days: 7

  security_and_quality_checks:
    name: Security and Quality Checks
    runs-on: ubuntu-latest
    needs: [backend_unit_tests, backend_api_integration_tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run security checks
        run: |
          cd backend
          # Banditでセキュリティ脆弱性をチェック
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . || echo "Security issues found, check bandit-report.json"
          
          # Safetyで既知の脆弱性をチェック
          safety check --json --output safety-report.json || true
          safety check || echo "Dependency vulnerabilities found, check safety-report.json"
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend_unit_tests, backend_api_integration_tests, frontend_tests, e2e_tests, security_and_quality_checks]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate test summary
        run: |
          echo "# Test Execution Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "## Test Results" >> test-summary.md
          echo "" >> test-summary.md
          
          # ジョブの結果をチェック
          if [ "${{ needs.backend_unit_tests.result }}" == "success" ]; then
            echo "✅ Backend Unit Tests: PASSED" >> test-summary.md
          else
            echo "❌ Backend Unit Tests: FAILED" >> test-summary.md
          fi
          
          if [ "${{ needs.backend_api_integration_tests.result }}" == "success" ]; then
            echo "✅ Backend API Integration Tests: PASSED" >> test-summary.md
          else
            echo "❌ Backend API Integration Tests: FAILED" >> test-summary.md
          fi
          
          if [ "${{ needs.frontend_tests.result }}" == "success" ]; then
            echo "✅ Frontend Tests: PASSED" >> test-summary.md
          else
            echo "❌ Frontend Tests: FAILED" >> test-summary.md
          fi
          
          if [ "${{ needs.e2e_tests.result }}" == "success" ]; then
            echo "✅ End-to-End Tests: PASSED" >> test-summary.md
          else
            echo "❌ End-to-End Tests: FAILED" >> test-summary.md
          fi
          
          if [ "${{ needs.security_and_quality_checks.result }}" == "success" ]; then
            echo "✅ Security and Quality Checks: PASSED" >> test-summary.md
          else
            echo "⚠️ Security and Quality Checks: COMPLETED WITH WARNINGS" >> test-summary.md
          fi
          
          echo "" >> test-summary.md
          echo "## Coverage Reports" >> test-summary.md
          echo "- Unit Test Coverage: Available in artifacts" >> test-summary.md
          echo "- API Integration Test Coverage: Available in artifacts" >> test-summary.md
          echo "- Frontend Test Coverage: Available in artifacts" >> test-summary.md
          echo "- End-to-End Test Coverage: Available in artifacts" >> test-summary.md
          
          cat test-summary.md
      
      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
      
      - name: Notify completion
        run: |
          if [ "${{ needs.backend_unit_tests.result }}" == "success" ] && [ "${{ needs.backend_api_integration_tests.result }}" == "success" ] && [ "${{ needs.frontend_tests.result }}" == "success" ] && [ "${{ needs.e2e_tests.result }}" == "success" ]; then
            echo "🎉 All tests passed successfully!"
          else
            echo "⚠️ Some tests failed. Please check the individual job results."
            exit 1
          fi 